<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - Attendance</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { background: #2c3e50; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: white; }
        #reader { width: 300px; height: 300px; background: black; border: 5px solid #3498db; }
        .info-box { background: white; color: black; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; width: 80%; max-width: 300px; }
        .hidden { display: none; }
        .btn { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="info-box">
        <h3>📷 Attendance Scanner</h3>
        <p id="statusMsg">Waiting for QR Code...</p>
    </div>

    <div id="reader"></div>
    
    <div id="resultBox" class="info-box hidden">
        <h2 style="color:green">✅ Marked!</h2>
        <p id="empName"></p>
        <p id="markTime"></p>
        <button class="btn" onclick="location.reload()">Scan Next</button>
    </div>

    <script>
        // --- FIREBASE CONFIG (SAME AS INDEX.HTML) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDuegsEGAZjfoSecDrLaQNXLQqszY2MQVY",
            authDomain: "attendence0.firebaseapp.com",
            projectId: "attendence0",
            storageBucket: "attendence0.firebasestorage.app",
            messagingSenderId: "485278266632",
            appId: "1:485278266632:web:37db1d8c0a2c2586c0a8bd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- URL PARAMS ---
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const name = urlParams.get('name');
        const validDate = urlParams.get('v');
        const today = new Date().toISOString().slice(0, 10);

        // --- LOGIC ---
        function onScanSuccess(decodedText, decodedResult) {
            // Check if user is on scan page with valid ID
            // For this system, the link itself contains data, so we verify the scan matches the URL or just process the scan if it's a camera page
            // Since this page IS the destination, we are actually scanning the employee's phone or card.
            // BUT wait, your system generates a link to THIS page.
            // Meaning: The Employee shows QR -> Admin Scans it? 
            // OR Admin generates QR -> Employee Scans it?
            
            // Logic: Your generateQR code makes a link to: scan.html?id=...
            // This means the person scanning (Employee) will land HERE.
            // So we just need to mark attendance immediately if parameters exist.
        }

        // AUTO MARK IF PARAMETERS EXIST (Employee Scanned Admin's QR or clicked link)
        if(id && name && validDate) {
            document.getElementById('reader').style.display = 'none'; // Hide Camera if link mode
            
            if(validDate !== today) {
                document.getElementById('statusMsg').innerText = "❌ QR Code Expired!";
                document.getElementById('statusMsg').style.color = "red";
            } else {
                markAttendance(id, name);
            }
        } 
        // IF NO PARAMETERS, OPEN CAMERA (Admin Scanning Employee's Static QR?)
        else {
             // If you want to use camera to scan OTHERS, use this:
             const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
             html5QrcodeScanner.render((text) => {
                 // Redirect to the scanned link
                 window.location.href = text;
             });
        }

        function markAttendance(empId, empName) {
            document.getElementById('statusMsg').innerText = "Marking Attendance...";
            
            const date = today;
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });

            db.collection("attendance").doc(date + "_" + empId).set({
                empId: parseInt(empId),
                empName: empName,
                date: date,
                time: time,
                status: "Present",
                selfie: "" // Can add camera capture here later if needed
            }).then(() => {
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('empName').innerText = empName;
                document.getElementById('markTime').innerText = "Time: " + time;
                document.getElementById('statusMsg').style.display = 'none';
            }).catch(e => {
                alert("Error: " + e.message);
            });
        }
    </script>
</body>
</html>
