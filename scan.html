<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - Attendance</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { background: #2c3e50; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: white; padding: 20px; }
        #reader { width: 100%; max-width: 400px; background: black; border: 5px solid #3498db; border-radius: 10px; overflow: hidden; }
        .info-box { background: white; color: black; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .hidden { display: none; }
        .btn { padding: 12px 25px; background: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        #statusMsg { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="info-box">
        <h3>📷 Attendance Scanner</h3>
        <p id="statusMsg">Align QR Code inside the frame</p>
    </div>

    <div id="reader"></div>
    
    <div id="resultBox" class="info-box hidden">
        <h2 style="color:green">✅ Marked!</h2>
        <p id="empNameDisplay"></p>
        <p id="markTime"></p>
        <button class="btn" onclick="location.reload()">Scan Another</button>
    </div>

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDuegsEGAZjfoSecDrLaQNXLQqszY2MQVY",
            authDomain: "attendence0.firebaseapp.com",
            projectId: "attendence0",
            storageBucket: "attendence0.firebasestorage.app",
            messagingSenderId: "485278266632",
            appId: "1:485278266632:web:37db1d8c0a2c2586c0a8bd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- CAMERA SCANNER LOGIC ---
        function onScanSuccess(decodedText) {
            // QR Code scan hote hi yahan processing hogi
            try {
                // Link se data nikalna (id, name, v)
                const url = new URL(decodedText);
                const id = url.searchParams.get('id');
                const name = url.searchParams.get('name');
                const validDate = url.searchParams.get('v');
                const today = new Date().toISOString().slice(0, 10);

                if(id && name && validDate === today) {
                    html5QrcodeScanner.clear(); // Camera band kar dein
                    markAttendance(id, name);
                } else {
                    alert("❌ Invalid or Expired QR Code!");
                }
            } catch (e) {
                console.error("Not a valid URL");
            }
        }

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);

        function markAttendance(empId, empName) {
            const date = new Date().toISOString().slice(0, 10);
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });

            db.collection("attendance").doc(date + "_" + empId).set({
                empId: parseInt(empId),
                empName: empName,
                date: date,
                time: time,
                status: "Present"
            }).then(() => {
                document.getElementById('reader').classList.add('hidden');
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('empNameDisplay').innerText = "Employee: " + empName;
                document.getElementById('markTime').innerText = "Time: " + time;
            }).catch(e => alert("Error: " + e.message));
        }
    </script>
</body>
</html>
